[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbit-container"
version = "0.0.1"
description = "GBit Container — Modern native process orchestrator (zero Docker/Podman)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "GBit"},
]
keywords = ["process-manager", "subprocess", "orchestrator", "cli", "pm2-like", "foreman", "procfile", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "flask>=3.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
gbit-container = "gbit_container.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["gbit_container*"]

[tool.setuptools.package-data]
"gbit_container" = [
    "dashboard/templates/*.html",
    "dashboard/static/**/*",
    "templates/**/*",
]

[project.urls]
Homepage = "https://github.com/gbit-container/gbit-container"
